name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          cargo build --release --message-format=short 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # Put the whole compiler output in one annotation so it can be read
          # from the run summary (and by the API) without downloading logs.
          $log = (Get-Content build.log -Raw)
          if ($null -eq $log) { $log = "" }
          if ($log.Length -gt 60000) { $log = $log.Substring(0, 60000) }
          $enc = $log.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          if ($code -ne 0) {
            Write-Output "::error title=cargo build failed::$enc"
            exit 1
          } elseif ($log -match 'warning') {
            Write-Output "::warning title=cargo build warnings::$enc"
          }

      - uses: actions/upload-artifact@v5
        with:
          name: betterui
          path: target/release/betterui.exe

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == 0.0.* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Every merge to main that raises the version publishes a release
      # tagged v<version>. 0.0.x releases are pre-releases; 0.1.0 is the MVP.
      - name: Publish release v${{ steps.version.outputs.version }}
        if: github.event_name == 'push' && steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: betterUI v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Built from ${{ github.sha }}.

            Code signing policy: ${{ github.server_url }}/${{ github.repository }}#code-signing-policy
          files: target/release/betterui.exe

  # Launch the built exe on a real Windows desktop, check that it keeps
  # running, and take a screenshot. The screenshot and betterUI's log are
  # pushed to the `ci-screenshots` branch so they can be reviewed without
  # downloading anything.
  smoke-test:
    needs: build
    runs-on: windows-latest
    concurrency:
      group: smoke-test
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: betterui

      - name: Run betterUI and take screenshots
        shell: pwsh
        run: |
          # Turn on Windows transparency effects (off by default on the runner)
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name EnableTransparency -Value 1 -Type DWord -ErrorAction SilentlyContinue
          $t = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -ErrorAction SilentlyContinue).EnableTransparency
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          function Shot($file) {
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$file", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          # name of screenshot => command-line argument
          $runs = [ordered]@{
            'screenshot.png'       = $null
            'audio-devices.png'    = '--test-open=audio-devices --demo-audio'
            'audio-mixer.png'      = '--test-open=audio-mixer --demo-audio'
            'bluetooth.png'        = '--test-open=bluetooth --demo'
            'control-center.png'   = '--test-open=control-center --demo'
            'dock.png'             = '--test-open=dock'
            'tray.png'             = '--test-open=tray --demo'
          }
          $report = @()
          $failed = $false
          foreach ($file in $runs.Keys) {
            $arg = $runs[$file]
            $proc = if ($arg) { Start-Process .\betterui.exe -ArgumentList $arg -PassThru } else { Start-Process .\betterui.exe -PassThru }
            Start-Sleep -Seconds 7
            Shot $file
            $alive = -not $proc.HasExited
            $report += "$file : still running after 7s = $alive" + $(if (-not $alive) { " (exit code $($proc.ExitCode))" } else { "" })
            if ($alive) { Stop-Process -Id $proc.Id -Force; Start-Sleep -Seconds 1 } else { $failed = $true }
          }

          $logPath = Join-Path $env:APPDATA 'betterUI\log.txt'
          $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '(no log file)' }
          $explorer = [bool](Get-Process explorer -ErrorAction SilentlyContinue)
          @"
          commit: $env:GITHUB_SHA
          ref: $env:GITHUB_HEAD_REF$env:GITHUB_REF_NAME
          screen: $($b.Width)x$($b.Height)
          explorer running: $explorer
          transparency effects: $t
          $($report -join "`n")
          --- log.txt ---
          $log
          "@ | Set-Content smoke.txt

          Get-Content smoke.txt
          if ($failed) {
            $enc = (Get-Content smoke.txt -Raw).Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=betterUI exited during smoke test::$enc"
            exit 1
          }

      - name: Publish screenshot to ci-screenshots branch
        if: always()
        shell: pwsh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path screenshot.png)) { exit 0 }
          New-Item -ItemType Directory shots | Out-Null
          Copy-Item *.png, smoke.txt shots\
          Set-Location shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test screenshot for $env:GITHUB_SHA"
          git push -q --force "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-screenshots

  # Every PR must raise the version in Cargo.toml to a version that has not
  # been released yet, so each merge maps to exactly one release.
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version must be new and higher than every release
        shell: bash
        run: |
          new=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          last=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
          echo "newest release: ${last:-none}   this PR: $new"
          if [ -n "$last" ]; then
            if [ "$new" = "$last" ] || [ "$(printf '%s\n%s\n' "$last" "$new" | sort -V | tail -n1)" != "$new" ]; then
              echo "::error title=Version not raised::Raise 'version' in Cargo.toml above $last (this PR has $new). Each PR becomes one release."
              exit 1
            fi
          fi
          echo "Merging this PR will publish release v$new"

  # Record a short video of each feature being used (scripted mouse and
  # keyboard, demo data for hardware the CI machine doesn't have). Videos
  # are pushed to the `ci-videos` branch.
  feature-videos:
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    concurrency:
      group: feature-videos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: betterui

      - name: Install ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress | Out-Null
          }
          Get-Command ffmpeg

      - name: Record feature videos
        shell: pwsh
        run: |
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name EnableTransparency -Value 1 -Type DWord -ErrorAction SilentlyContinue
          ./ci/record-features.ps1 -Exe ./betterui.exe -Out videos

      - name: Publish videos to ci-videos branch
        if: always()
        shell: pwsh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path videos)) { exit 0 }
          "commit: $env:GITHUB_SHA`nref: $env:GITHUB_HEAD_REF$env:GITHUB_REF_NAME" | Set-Content videos\info.txt
          Set-Location videos
          git init -q -b ci-videos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Feature videos for $env:GITHUB_SHA"
          git push -q --force "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-videos
